# =============================================================================
# DPI Engine — Application Configuration
# =============================================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: dpi-engine
  lifecycle:
    timeout-per-shutdown-phase: 30s

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# -----------------------------------------------------------------------------
# Resilience4j
# -----------------------------------------------------------------------------
resilience4j.circuitbreaker:
  instances:
    threatIntelApi:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 3
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
resilience4j.retry:
  instances:
    threatIntelApi:
      maxAttempts: 3
      waitDuration: 500ms

# -----------------------------------------------------------------------------
# Application Info
# -----------------------------------------------------------------------------
info:
  app:
    name: DPI Engine
    description: High-performance Deep Packet Inspection engine
    version: 0.1.0-SNAPSHOT

# -----------------------------------------------------------------------------
# DPI Custom Properties
# -----------------------------------------------------------------------------
dpi:
  app-name: DPI Engine
  version: 0.1.0-SNAPSHOT
  mode: ${DPI_MODE:server} # "pcap" = process file & exit, "server" = REST API only, "benchmark" = load test
  max-workers: 4
  default-action: ALLOW
  capture:
    buffer-size: 65536
    snapshot-length: 65535
    pcap-file-path: ${DPI_PCAP_FILE:} # path to PCAP file (required when mode=pcap)
    batch-log-interval: 1000 # log progress every N packets
  worker:
    count: ${DPI_WORKER_COUNT:4} # number of worker threads
    queue-capacity: 10000 # max packets per worker queue
